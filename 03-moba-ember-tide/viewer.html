<!doctype html>
<meta charset="utf-8"><title>烬与潮 · 动作预览</title>
<!-- 开发用：看任意一个角色模型的动作。网址参数：?model=/assets/hero/lan.glb&height=3.1&a=动作名&t=秒&view=close|game|front|side&ui=0
     抽帧检查用 tools/anim_sheet.mjs（环境变量 VIEW_URL 指到这里）。查看器本体是 tools/hero_viewer.js，和验收页里的是同一个。 -->
<style>html,body{margin:0;height:100%;background:#14181d;color:#cdd;font:13px system-ui}#stage{position:fixed;inset:0}#view{width:100%;height:100%;display:block}#stage-note{position:fixed;left:10px;top:8px}#acts{position:fixed;left:10px;bottom:10px;display:flex;gap:6px;flex-wrap:wrap}#acts button{font:inherit;padding:5px 10px;background:#232a31;color:#dde;border:1px solid #445;border-radius:4px;cursor:pointer}#acts button[aria-pressed=true]{border-color:#8fe6de}.bare #acts{display:none}</style>
<div id="stage"><canvas id="view"></canvas><div id="stage-note">载入中…</div></div><div id="acts"></div>
<script>
  const q = new URLSearchParams(location.search), names = ["idle_pose", "idle", "run", "walk", "attack", "attack1", "attack2", "q", "w", "e", "r", "hook", "veil", "ult", "death"];
  window.HERO_VIEW = { model: q.get("model") || "/assets/hero/lan.glb", look: { height: +(q.get("height") || 3.1), lift: 1.4, sat: 1.3, fill: 0.5, rim: 1.2, metal: 0.15, bump: 0.5, head: 1.18, hand: 1.3 },
    actions: names.map(id => ({ id, label: id, loop: ["idle_pose", "idle", "run", "walk"].includes(id) })) };
</script>
<script type="module" src="/tools/hero_viewer.js"></script>

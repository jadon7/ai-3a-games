<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>烬与潮</title>
<meta name="description" content="三对三、三条线、一条河的网页 MOBA。六个英雄，电脑对手，手机横屏也能玩。">
<meta name="theme-color" content="#0d1014">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="烬与潮">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icons/favicon.png">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<style>
  /* 整页钉死：不滚动、不回弹、不能双击或者捏合把页面放大（手机上这些手势都留给游戏） */
  html, body { margin: 0; height: 100%; background: #0d1014; overflow: hidden; overscroll-behavior: none; }
  body { position: fixed; inset: 0; touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  canvas#view { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
  canvas#guide { display: block; }
  /* 暗角（阶段 8）：四角轻轻压暗，视线往中间收。盖在画布上面、界面下面 */
  #vig { position: fixed; inset: 0; pointer-events: none; z-index: 1; background: radial-gradient(ellipse 78% 78% at 50% 46%, rgba(4,9,12,0) 58%, rgba(4,9,12,.34) 100%); }
  #hud { position: fixed; left: max(12px, env(safe-area-inset-left)); bottom: 10px; font: 12px/1.6 -apple-system, "PingFang SC", sans-serif; color: #e6eaf0; text-shadow: 0 1px 2px #000; pointer-events: none; white-space: pre; }
</style>
</head>
<body>
<canvas id="view" tabindex="0"></canvas>
<canvas id="guide" hidden></canvas>
<div id="vig"></div>
<div id="hud"></div>
<script type="module" src="/src/map/world/main.ts"></script>
</body>
</html>

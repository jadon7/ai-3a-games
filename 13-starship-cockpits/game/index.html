<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>三界座舱 Starship Cockpits</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Michroma&family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&family=Share+Tech+Mono&family=VT323&display=swap" rel="stylesheet">
<style>
  /* layout: full-bleed render, one floating selector bottom-centre that fades when idle */
  :root {
    --ink: #e9eef2;
    --ink-dim: rgba(233, 238, 242, 0.55);
    --glass: rgba(14, 17, 20, 0.55);
    --line: rgba(255, 255, 255, 0.14);
    --accent: #ffb25a;
    --font-ui: "Barlow Condensed", "Arial Narrow", "PingFang SC", "Microsoft YaHei", sans-serif;
    color-scheme: dark;
  }
  html, body { height: 100%; margin: 0; background: #000; color: var(--ink); font-family: var(--font-ui); overflow: hidden; }
  #view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  #fade { position: fixed; inset: 0; background: #000; opacity: 1; pointer-events: none; transition: opacity .45s ease; display: grid; place-items: center; }
  #fade.off { opacity: 0; }
  #fade span { font-size: 13px; letter-spacing: .5em; text-indent: .5em; color: var(--ink-dim); text-transform: uppercase; }
  #bar { position: fixed; left: 0; right: 0; margin-inline: auto; width: max-content; bottom: 18px; display: flex; gap: 4px; padding: 4px;
    background: var(--glass); border: 1px solid var(--line); border-radius: 999px; backdrop-filter: blur(14px) saturate(1.3); -webkit-backdrop-filter: blur(14px) saturate(1.3);
    transition: opacity .6s ease, transform .6s ease; max-width: calc(100% - 32px); }
  #bar.idle { opacity: 0; transform: translateY(12px); pointer-events: none; }
  #bar button { appearance: none; border: 0; background: transparent; color: var(--ink-dim); font: 600 14px/1 var(--font-ui); letter-spacing: .16em; text-indent: .16em;
    padding: 10px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap; transition: color .2s, background .2s; }
  #bar button:hover { color: var(--ink); }
  #bar button[aria-pressed="true"] { color: #0b0d0f; background: var(--ink); }
  #bar button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  #bar .sep { width: 1px; margin: 6px 4px; background: var(--line); }
  #bar .ico { padding: 10px 12px; letter-spacing: 0; text-indent: 0; }
  #err { position: fixed; inset: 0; display: none; place-items: center; padding: 24px; text-align: center; font-size: 16px; line-height: 1.6; color: var(--ink-dim); }
  @media (max-width: 520px) { #bar button { padding: 9px 10px; font-size: 12px; letter-spacing: .08em; text-indent: .08em; } }
</style>
<script type="importmap">
{ "imports": {
  "three": "./js/vendor/three.module.js",
  "three/addons/": "./js/vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="view" aria-label="实时渲染的飞船座舱仪表盘"></canvas>
<div id="fade"><span id="fadeText">正在点亮座舱</span></div>
<div id="err"></div>
<nav id="bar" aria-label="座舱风格">
  <button type="button" data-style="cyber" aria-pressed="false">赛博朋克</button>
  <button type="button" data-style="nasa" aria-pressed="false">NASA 朋克</button>
  <button type="button" data-style="y2k" aria-pressed="false">Y2K</button>
  <span class="sep" aria-hidden="true"></span>
  <button type="button" class="ico" id="full" title="全屏" aria-label="全屏">⛶</button>
</nav>
<script type="module">
import { App } from './js/core.js';

const $ = s => document.querySelector(s);
const fade = $('#fade'), bar = $('#bar'), errBox = $('#err');
const fail = msg => { errBox.style.display = 'grid'; errBox.textContent = msg; fade.classList.add('off'); };
const wait = ms => new Promise(r => setTimeout(r, ms));
const fonts = ['700 20px Orbitron', '900 20px Orbitron', '500 20px Orbitron', '600 20px Rajdhani', '700 20px Rajdhani', '500 20px Rajdhani', '20px "Share Tech Mono"', '600 20px "Barlow Condensed"', '700 20px "Barlow Condensed"', '500 20px "Barlow Condensed"', '20px Michroma', '20px VT323'];

let app;
try { app = new App($('#view')); } catch (e) { fail('这个浏览器无法启动 WebGL2,座舱渲染不出来。请换用开启了硬件加速的 Chrome / Edge / Safari。'); throw e; }
window.app = app;
app.motion = !matchMedia('(prefers-reduced-motion: reduce)').matches;

const loaders = { cyber: () => import('./js/cyber.js'), nasa: () => import('./js/nasa.js'), y2k: () => import('./js/y2k.js') };
const built = {}; let busy = false, current = null;

async function show(name) {
  if (busy || name === current || !loaders[name]) return;
  busy = true; fade.classList.remove('off'); await wait(current ? 460 : 30);
  try {
    if (!built[name]) { const mod = await loaders[name](); built[name] = mod.build(app); }
    app.use(built[name]); current = name;
    for (const b of bar.querySelectorAll('[data-style]')) b.setAttribute('aria-pressed', String(b.dataset.style === name));
    try { history.replaceState(null, '', '#' + name); } catch (e) { location.hash = name; }
    app.frame(performance.now()); await wait(60);
  } catch (e) { console.error(e); fail('座舱加载失败:' + (e && e.message ? e.message : e)); }
  fade.classList.add('off'); busy = false;
}

bar.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.style) show(b.dataset.style);
  else if (b.id === 'full') { const el = document.documentElement; (document.fullscreenElement ? document.exitFullscreen() : el.requestFullscreen?.())?.catch?.(() => {}); }
});
addEventListener('keydown', e => { const k = { '1': 'cyber', '2': 'nasa', '3': 'y2k' }[e.key]; if (k) show(k); });
addEventListener('hashchange', () => { const h = location.hash.slice(1); if (loaders[h]) show(h); });

let idleT; const wake = () => { bar.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (!bar.matches(':hover') && !bar.contains(document.activeElement)) bar.classList.add('idle'); }, 3200); };
addEventListener('pointermove', wake); addEventListener('pointerdown', wake); addEventListener('keydown', wake); wake();

await Promise.race([Promise.all(fonts.map(f => document.fonts.load(f).catch(() => {}))), wait(3500)]);
const first = loaders[location.hash.slice(1)] ? location.hash.slice(1) : 'cyber';
await show(first);
const loop = now => { app.frame(now); requestAnimationFrame(loop); };
requestAnimationFrame(loop);
</script>
</body>
</html>

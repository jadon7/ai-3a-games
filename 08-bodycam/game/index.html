<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>随身记录仪 · 清剿</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif; }
  #stage { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: #000; }
  #gl { width: 100%; height: 100%; display: block; }
  /* 记录仪的屏显（时间戳 / 机号 / 录制灯） */
  #osd { position: absolute; right: 6.7%; top: 3.1%; color: #eee; font-family: Menlo, Consolas, "Courier New", monospace; white-space: pre; line-height: 1.27;
    text-shadow: 0.07em 0.07em 0 #000, -0.04em -0.04em 0 #000, 0.07em -0.04em 0 #000, -0.04em 0.07em 0 #000; pointer-events: none; user-select: none; }
  #osd .dot { display: inline-block; width: 0.68em; height: 0.68em; border-radius: 50%; background: #e11e1e; margin-left: 0.35em; vertical-align: -0.02em; text-shadow: none; }
  #hint { position: absolute; left: 3%; bottom: 4%; color: rgba(238,238,238,.82); font-family: Menlo, Consolas, monospace; font-size: 1.25vw; pointer-events: none; white-space: pre;
    text-shadow: 0.07em 0.07em 0 #000; }
  #hurt { position: absolute; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 38%, rgba(0,0,0,.55) 72%, rgba(0,0,0,.96) 100%); }
  #overlay { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,.62); color: #e9e7e0; z-index: 5; }
  #overlay .box { width: min(78%, 760px); }
  #overlay h1 { font: 600 34px/1.2 Menlo, Consolas, monospace; letter-spacing: .12em; margin: 0 0 6px; }
  #overlay .sub { color: #9a9892; font-size: 14px; margin-bottom: 22px; }
  #overlay .keys { display: grid; grid-template-columns: auto 1fr auto 1fr; gap: 7px 16px; font-size: 14px; margin-bottom: 22px; }
  #overlay .keys b { font-family: Menlo, Consolas, monospace; color: #ffd65a; font-weight: 600; white-space: nowrap; }
  #overlay .row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  #overlay button { font: 600 15px/1 "PingFang SC", sans-serif; padding: 12px 20px; border: 1px solid #55534d; background: #17171a; color: #e9e7e0; cursor: pointer; border-radius: 3px; }
  #overlay button.primary { background: #ffd65a; color: #111; border-color: #ffd65a; }
  #overlay button.on { border-color: #ffd65a; color: #ffd65a; }
  #overlay .note { color: #8b8a85; font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
  #overlay .stats { font-family: Menlo, Consolas, monospace; font-size: 15px; line-height: 1.75; margin: 0 0 20px; white-space: pre; color: #d9d7d0; }
  #loading { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #e8e6df; background: #050505; z-index: 10; gap: 14px; }
  #loading .bar { width: 320px; height: 3px; background: #222; }
  #loading .bar i { display: block; height: 100%; width: 0; background: #ffd65a; transition: width .2s; }
  #loading .t { font: 600 24px Menlo, Consolas, monospace; letter-spacing: .2em; }
  #loading .s { color: #8b8a85; font-size: 13px; }
  #fps { position: fixed; left: 8px; top: 6px; color: #7f7; font: 12px Menlo, monospace; z-index: 20; white-space: pre; }
</style>
<script type="importmap">
{ "imports": {
  "three": "./node_modules/three/build/three.module.js",
  "three/addons/": "./node_modules/three/examples/jsm/",
  "three-mesh-bvh": "./node_modules/three-mesh-bvh/build/index.module.js"
} }
</script>
</head>
<body>
<div id="stage">
  <canvas id="gl"></canvas>
  <div id="osd"></div>
  <div id="hurt"></div>
  <div id="hint"></div>
  <div id="overlay" style="display:none"><div class="box" id="obox"></div></div>
</div>
<div id="fps"></div>
<div id="loading"><div class="t">BODY CAM</div><div class="bar"><i id="lbar"></i></div><div class="s" id="lmsg">加载中…</div></div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
